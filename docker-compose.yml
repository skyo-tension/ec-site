version: '3.8'
services:
  web:
    build: .
    image: php:8.2-apache
    container_name: ecsite_web
    volumes:
      - ./:/var/www/html
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_NAME=shop
      - DB_USER=root
      - DB_PASS=secret
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: ecsite_db
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: shop
    volumes:
      - db_data:/var/lib/mysql
      - ./shop.sql:/docker-entrypoint-initdb.d/shop.sql:ro

volumes:
  db_data:
